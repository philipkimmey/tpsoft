<!DOCTYPE html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}TP Soft{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
    {% block extra_head %}{% endblock %}
  </head>
  <body class="min-h-screen bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950 text-slate-100 font-sans flex flex-col">
    <header class="sticky top-0 border-b border-slate-800 bg-slate-950/80 backdrop-blur">
      <div class="mx-auto flex max-w-5xl items-center justify-between px-6 py-4">
        <div class="text-lg font-semibold tracking-tight">TP Soft</div>
        <nav class="flex items-center gap-4 text-sm font-semibold text-slate-300">
          <a class="hover:text-white" href="#">Product</a>
          <a class="hover:text-white" href="#">Pricing</a>
          <a class="hover:text-white" href="#">Contact</a>
        </nav>
      </div>
    </header>

    <main class="mx-auto flex w-full max-w-5xl flex-1 px-6 py-10">
      {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-slate-800 bg-slate-950/90 py-6 text-center text-sm text-slate-400">
      <div class="mx-auto max-w-5xl px-6">
        <p>Specialty contractor tooling, made simple.</p>
      </div>
    </footer>
  </body>
</html>

<!DOCTYPE html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}TP Soft{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/modern-normalize/modern-normalize.min.css" />
    <link rel="stylesheet" href="{% static 'web/styles.css' %}" />
    <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <div class="brand">TP Soft</div>
        <nav class="nav-links">
          <a href="#">Product</a>
          <a href="#">Pricing</a>
          <a href="#">Contact</a>
        </nav>
      </div>
    </header>

    <main class="container">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>Specialty contractor tooling, made simple.</p>
      </div>
    </footer>
  </body>
</html>
